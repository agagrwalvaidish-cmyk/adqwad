
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Quiz Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.quiz-container {
    background: #ffffff;
    color: #222;
    width: 90%;
    max-width: 550px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 35px #0008;
    text-align: center;
}

h1 {
    color: #6246ea;
}

#question {
    font-size: 21px;
    margin: 25px 0;
}

#options {
    display: grid;
    gap: 12px;
}

.option {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
}

.option:hover:not(:disabled) {
    background: #eeeaff;
    border-color: #6246ea;
}

.correct {
    background: #b8f5c6;
    border-color: green;
}

.wrong {
    background: #ffc6c6;
    border-color: red;
}

button {
    cursor: pointer;
}

#nextBtn, #restartBtn {
    background: #6246ea;
    color: white;
    border: none;
    padding: 13px 30px;
    border-radius: 10px;
    margin-top: 25px;
    font-size: 16px;
}

#nextBtn:hover, #restartBtn:hover {
    background: #4932bd;
}

#nextBtn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

#result {
    font-size: 22px;
    margin-top: 20px;
}

#progress {
    color: #777;
}
</style>
</head>

<body>

<div class="quiz-container">

    <h1>🧠 Ultimate Quiz</h1>

    <p id="progress">Question 1 of 10</p>

    <h2 id="question">Loading question...</h2>

    <div id="options"></div>

    <button id="nextBtn" disabled onclick="nextQuestion()">
        Next Question →
    </button>

    <div id="result"></div>

</div>

<script>

const questions = [
    {
        question: "What is the capital of India?",
        options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
        answer: "New Delhi"
    },
    {
        question: "Which planet is known as the Red Planet?",
        options: ["Earth", "Venus", "Mars", "Jupiter"],
        answer: "Mars"
    },
    {
        question: "How many continents are there?",
        options: ["5", "6", "7", "8"],
        answer: "7"
    },
    {
        question: "Who invented the telephone?",
        options: ["Newton", "Alexander Graham Bell", "Einstein", "Edison"],
        answer: "Alexander Graham Bell"
    },
    {
        question: "Which is the largest ocean?",
        options: ["Atlantic", "Indian", "Arctic", "Pacific"],
        answer: "Pacific"
    },
    {
        question: "What is 12 × 8?",
        options: ["86", "96", "108", "88"],
        answer: "96"
    },
    {
        question: "Which gas do plants absorb?",
        options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"],
        answer: "Carbon dioxide"
    },
    {
        question: "Which is the fastest land animal?",
        options: ["Lion", "Horse", "Cheetah", "Tiger"],
        answer: "Cheetah"
    },
    {
        question: "Which language is used to style websites?",
        options: ["HTML", "CSS", "Python", "Java"],
        answer: "CSS"
    },
    {
        question: "How many sides does a hexagon have?",
        options: ["5", "6", "7", "8"],
        answer: "6"
    }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("question").innerText = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    document.getElementById("result").innerText = "";
    document.getElementById("nextBtn").disabled = true;

    q.options.forEach(option => {

        const btn = document.createElement("button");

        btn.innerText = option;
        btn.className = "option";

        btn.onclick = () => checkAnswer(btn, option);

        optionsDiv.appendChild(btn);

    });
}

function checkAnswer(button, selected) {

    const correct = questions[currentQuestion].answer;

    const allButtons = document.querySelectorAll(".option");

    allButtons.forEach(btn => {
        btn.disabled = true;

        if (btn.innerText === correct) {
            btn.classList.add("correct");
        }
    });

    if (selected === correct) {
        score++;
        document.getElementById("result").innerText = "✅ Correct Answer!";
    } else {
        button.classList.add("wrong");
        document.getElementById("result").innerText =
            "❌ Incorrect! Correct answer: " + correct;
    }

    document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {

    document.querySelector(".quiz-container").innerHTML = `
        <h1>🏆 Quiz Completed!</h1>
        <h2>Your Score</h2>
        <div id="result">
            ${score} / ${questions.length}
        </div>
        <p>${score >= 8 ? "Amazing Work! 🌟" :
           score >= 5 ? "Good Job! 👏" :
           "Keep Practising! 💪"}</p>
        <button id="restartBtn" onclick="restartQuiz()">
            Play Again
        </button>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    location.reload();
}

loadQuestion();

</script>

</body>
</html>
