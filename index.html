
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Explorer 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <h1>🌊 OCEAN EXPLORER</h1>
        <p>🐚 Treasures: <span id="score">0</span></p>
        <p>🫧 Oxygen: <span id="oxygen">100</span>%</p>
        <p id="message">Explore the ocean!</p>
    </div>

    <div id="start">
        <h1>OCEAN EXPLORER</h1>
        <p>Discover the mysteries of the deep sea.</p>
        <button id="play">START EXPLORING</button>
        <p>WASD = Move | Mouse = Look around</p>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
