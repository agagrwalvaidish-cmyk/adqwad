
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoVault - Video Recorder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101525;
    color: white;
}

header {
    background: #1b2540;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #70d6ff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
}

.camera-box {
    background: #1b2540;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

video {
    width: 100%;
    max-height: 430px;
    background: black;
    border-radius: 12px;
    object-fit: contain;
}

.controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.start {
    background: #00c781;
    color: white;
}

.stop {
    background: #ff4757;
    color: white;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

h2 {
    margin-top: 35px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.card {
    background: #1b2540;
    padding: 12px;
    border-radius: 12px;
}

.card video {
    width: 100%;
}

.card button {
    margin-top: 8px;
    width: 100%;
}

.delete {
    background: #ff4757;
    color: white;
}

.download {
    background: #477bff;
    color: white;
}

#status {
    color: #70d6ff;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>🎥 VideoVault</header>

<div class="container">

    <div class="camera-box">

        <h2>Record a Video</h2>

        <video id="camera" autoplay muted playsinline></video>

        <div class="controls">

            <button class="start" id="cameraBtn">
                Open Camera
            </button>

            <button class="start" id="recordBtn" disabled>
                ● Start Recording
            </button>

            <button class="stop" id="stopBtn" disabled>
                ■ Stop Recording
            </button>

        </div>

        <p id="status">Camera is not connected.</p>

    </div>

    <h2>📁 My Saved Videos</h2>

    <div class="gallery" id="gallery"></div>

</div>

<script>

const camera = document.getElementById("camera");
const cameraBtn = document.getElementById("cameraBtn");
const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const statusText = document.getElementById("status");
const gallery = document.getElementById("gallery");

let stream = null;
let recorder = null;
let chunks = [];

let videos = [];

cameraBtn.onclick = async () => {

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        camera.srcObject = stream;

        recordBtn.disabled = false;
        cameraBtn.disabled = true;

        statusText.innerText = "Camera connected! Ready to record.";

    } catch (error) {
        statusText.innerText =
            "Camera permission denied or camera unavailable.";
    }

};

recordBtn.onclick = () => {

    chunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
        if (event.data.size > 0) {
            chunks.push(event.data);
        }
    };

    recorder.onstop = () => {

        const blob = new Blob(chunks, {
            type: recorder.mimeType
        });

        saveVideo(blob);

        statusText.innerText = "Video saved successfully!";

    };

    recorder.start();

    recordBtn.disabled = true;
    stopBtn.disabled = false;

    statusText.innerText = "🔴 Recording video...";

};

stopBtn.onclick = () => {

    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }

    recordBtn.disabled = false;
    stopBtn.disabled = true;

};

function saveVideo(blob) {

    const url = URL.createObjectURL(blob);

    const videoData = {
        id: Date.now(),
        blob: blob,
        url: url,
        name: "Video_" + new Date().toLocaleString()
    };

    videos.push(videoData);

    const reader = new FileReader();

    reader.onload = () => {
        try {
            const link = document.createElement("a");
            link.href = reader.result;
            link.download = "VideoVault_" + videoData.id + ".webm";
            link.click();
        } catch (error) {
            console.log(error);
        }
    };

    reader.readAsDataURL(blob);

    showVideos();
}

function showVideos() {

    gallery.innerHTML = "";

    videos.forEach(video => {

        const card = document.createElement("div");

        card.className = "card";

        const preview = document.createElement("video");
        preview.src = video.url;
        preview.controls = true;
        preview.playsInline = true;

        const name = document.createElement("p");
        name.innerText = video.name;

        const downloadBtn = document.createElement("button");
        downloadBtn.className = "download";
        downloadBtn.innerText = "⬇ Download";

        downloadBtn.onclick = () => {
            const link = document.createElement("a");
            link.href = video.url;
            link.download = "VideoVault_" + video.id + ".webm";
            link.click();
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete";
        deleteBtn.innerText = "🗑 Delete";

        deleteBtn.onclick = () => {

            URL.revokeObjectURL(video.url);

            videos = videos.filter(v => v.id !== video.id);

            showVideos();

        };

        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(downloadBtn);
        card.appendChild(deleteBtn);

        gallery.appendChild(card);

    });

}

window.addEventListener("beforeunload", () => {
    stream?.getTracks().forEach(track => track.stop());
});

</script>

</body>
</html>
